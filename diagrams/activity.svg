@startuml
start
:Сбор требований (Discovery);
:Анализ и приоритизация;
:Проектирование (Design);
:Разработка (Development);

repeat
  :Тестирование (Testing);
  if (Есть критические баги?) then (да)
    :Исправление багов;
  else (нет)
    break
  endif
repeat while (Есть критические баги?) is (да)

:Подготовка релиза;
:Деплой (Release);
:Сбор обратной связи;
stop
@enduml

